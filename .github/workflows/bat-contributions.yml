name: Update Bat Contribution Night Patrol

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate_bat.py"

jobs:
  update-bat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate Bat Contribution Graph SVG
        run: |
          python .github/scripts/generate_bat.py --username Muntasir-Shawon --output assets/bat-contributions.svg

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add assets/bat-contributions.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update Gotham Bat contribution telemetry" && git push)
