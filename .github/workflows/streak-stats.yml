name: Update Streak Stats

on:
  schedule:
    - cron: 0 0 * * * # Daily at midnight UTC
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Muntasir-Shawon&theme=tokyonight&hide_border=true&background=0D1117&ring=38BDF8&fire=38BDF8&currStreakLabel=38BDF8
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add assets/streak.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update streak stats telemetry" && git push)
